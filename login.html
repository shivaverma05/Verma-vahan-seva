<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Verma Digital Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{dark:"#0a0a14",surface:"#12122a"},fontFamily:{poppins:["Poppins","sans-serif"]}}}}</script>
  <style>body{background-color:#0a0a14;font-family:"Poppins",sans-serif;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0a14}::-webkit-scrollbar-thumb{background:#8b5cf6;border-radius:3px}.tab-btn.active{color:#f97316;border-bottom:2px solid #f97316}</style>
</head>
<body>
<div class="w-full max-w-md px-4 py-10">
  <!-- Logo -->
  <div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center gap-2 mb-4">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#f97316,#8b5cf6)">
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12z"/></svg>
      </div>
      <span class="text-white font-bold text-xl">Verma <span style="color:#f97316">Digital</span> Studio</span>
    </a>
  </div>

  <!-- Card -->
  <div class="p-8 rounded-2xl" style="background:#12122a;border:1px solid rgba(255,255,255,0.08)">
    <!-- Tabs -->
    <div class="flex border-b mb-8" style="border-color:rgba(255,255,255,0.08)">
      <button id="loginTabBtn" onclick="switchTab('login')" class="tab-btn active flex-1 pb-3 text-sm font-semibold text-left" style="color:#f97316;border-bottom:2px solid #f97316">Login</button>
      <button id="registerTabBtn" onclick="switchTab('register')" class="tab-btn flex-1 pb-3 text-sm font-medium text-right" style="color:#94a3b8">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <form onsubmit="validateLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#94a3b8">Email Address</label>
          <input type="email" id="lEmail" placeholder="rahul@example.com" class="w-full px-4 py-3 rounded-xl text-sm outline-none" style="background:#0a0a14;border:1px solid rgba(255,255,255,0.15);color:#f1f5f9">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#94a3b8">Password</label>
          <div class="relative">
            <input type="password" id="lPassword" placeholder="Enter your password" class="w-full px-4 py-3 rounded-xl text-sm outline-none pr-10" style="background:#0a0a14;border:1px solid rgba(255,255,255,0.15);color:#f1f5f9">
            <button type="button" onclick="togglePass('lPassword')" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs" style="color:#94a3b8">👁</button>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-xs cursor-pointer" style="color:#94a3b8">
            <input type="checkbox" class="rounded"> Remember me
          </label>
          <a href="#" class="text-xs" style="color:#f97316">Forgot Password?</a>
        </div>
        <button type="submit" class="w-full py-3.5 rounded-full font-semibold text-sm text-white" style="background:#f97316">Login to Account</button>
      </form>
      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.08)"></div>
        <span class="text-xs" style="color:#94a3b8">or continue with</span>
        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.08)"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="alert('Google login coming soon!')" class="flex items-center justify-center gap-2 py-2.5 rounded-full text-sm border transition-all hover:bg-white/5" style="border-color:rgba(255,255,255,0.15);color:#f1f5f9">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button onclick="alert('GitHub login coming soon!')" class="flex items-center justify-center gap-2 py-2.5 rounded-full text-sm border transition-all hover:bg-white/5" style="border-color:rgba(255,255,255,0.15);color:#f1f5f9">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </button>
      </div>
      <p class="text-center text-xs mt-6" style="color:#94a3b8">Don't have an account? <button onclick="switchTab('register')" class="font-medium" style="color:#f97316">Register here</button></p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden">
      <form onsubmit="validateRegister(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#94a3b8">Full Name</label>
          <input type="text" id="rName" placeholder="Rahul Verma" class="w-full px-4 py-3 rounded-xl text-sm outline-none" style="background:#0a0a14;border:1px solid rgba(255,255,255,0.15);color:#f1f5f9">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#94a3b8">Email Address</label>
          <input type="email" id="rEmail" placeholder="rahul@example.com" class="w-full px-4 py-3 rounded-xl text-sm outline-none" style="background:#0a0a14;border:1px solid rgba(255,255,255,0.15);color:#f1f5f9">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#94a3b8">Password</label>
          <div class="relative">
            <input type="password" id="rPassword" placeholder="Min 8 characters" class="w-full px-4 py-3 rounded-xl text-sm outline-none pr-10" style="background:#0a0a14;border:1px solid rgba(255,255,255,0.15);color:#f1f5f9">
            <button type="button" onclick="togglePass('rPassword')" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs" style="color:#94a3b8">👁</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#94a3b8">Confirm Password</label>
          <input type="password" id="rConfirm" placeholder="Re-enter password" class="w-full px-4 py-3 rounded-xl text-sm outline-none" style="background:#0a0a14;border:1px solid rgba(255,255,255,0.15);color:#f1f5f9">
        </div>
        <label class="flex items-start gap-2 text-xs cursor-pointer" style="color:#94a3b8">
          <input type="checkbox" id="rTerms" class="mt-0.5 rounded flex-shrink-0">
          <span>I agree to the <a href="#" style="color:#f97316">Terms of Service</a> and <a href="#" style="color:#f97316">Privacy Policy</a></span>
        </label>
        <button type="submit" class="w-full py-3.5 rounded-full font-semibold text-sm text-white" style="background:#f97316">Create Account</button>
      </form>
      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.08)"></div>
        <span class="text-xs" style="color:#94a3b8">or continue with</span>
        <div class="flex-1 h-px" style="background:rgba(255,255,255,0.08)"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="alert('Google signup coming soon!')" class="flex items-center justify-center gap-2 py-2.5 rounded-full text-sm border" style="border-color:rgba(255,255,255,0.15);color:#f1f5f9">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button onclick="alert('GitHub signup coming soon!')" class="flex items-center justify-center gap-2 py-2.5 rounded-full text-sm border" style="border-color:rgba(255,255,255,0.15);color:#f1f5f9">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </button>
      </div>
      <p class="text-center text-xs mt-6" style="color:#94a3b8">Already have an account? <button onclick="switchTab('login')" class="font-medium" style="color:#f97316">Login here</button></p>
    </div>
  </div>

  <p class="text-center text-xs mt-6" style="color:#94a3b8"><a href="index.html" style="color:#94a3b8">← Back to Home</a></p>
</div>
<script>
  function switchTab(tab) {
    if(tab === 'login') {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginTabBtn').classList.add('active');
      document.getElementById('loginTabBtn').style.color='#f97316';
      document.getElementById('loginTabBtn').style.borderBottom='2px solid #f97316';
      document.getElementById('registerTabBtn').classList.remove('active');
      document.getElementById('registerTabBtn').style.color='#94a3b8';
      document.getElementById('registerTabBtn').style.borderBottom='none';
    } else {
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerTabBtn').classList.add('active');
      document.getElementById('registerTabBtn').style.color='#f97316';
      document.getElementById('registerTabBtn').style.borderBottom='2px solid #f97316';
      document.getElementById('loginTabBtn').classList.remove('active');
      document.getElementById('loginTabBtn').style.color='#94a3b8';
      document.getElementById('loginTabBtn').style.borderBottom='none';
    }
  }

  function validateLogin(e) {
    e.preventDefault();
    const email = document.getElementById('lEmail').value.trim();
    const password = document.getElementById('lPassword').value;
    if(!email || !password) { alert('Please fill all fields'); return; }
    if(password.length < 8) { alert('Password must be at least 8 characters'); return; }
    alert('Login successful! Redirecting to dashboard...');
    window.location.href = 'dashboard.html';
  }

  function validateRegister(e) {
    e.preventDefault();
    const name = document.getElementById('rName').value.trim();
    const email = document.getElementById('rEmail').value.trim();
    const password = document.getElementById('rPassword').value;
    const confirm = document.getElementById('rConfirm').value;
    const terms = document.getElementById('rTerms').checked;
    if(!name || !email || !password || !confirm) { alert('Please fill all fields'); return; }
    if(password.length < 8) { alert('Password must be at least 8 characters'); return; }
    if(password !== confirm) { alert('Passwords do not match'); return; }
    if(!terms) { alert('Please accept the Terms of Service'); return; }
    alert('Account created successfully! Welcome to Verma Digital Studio!');
    switchTab('login');
  }

  function togglePass(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
